guide_axo:`<h3>1. Resesif: Leucistic, Albino, Melanoid, Axanthic, Copper</h3><p>Hampir semua morph axolotl resesif: butuh <b>dua salinan</b> agar terlihat, dan axolotl dengan satu salinan disebut het (tampak Wild Type).</p>
<ul><li><b>Leucistic</b>: tubuh putih-pink dengan mata gelap dan insang merah, karena sel pigmen tidak berpindah ke kulit saat embrio.</li><li><b>Albino</b>: tanpa pigmen gelap, mata terang. Albino biasa berwarna emas (Golden Albino).</li><li><b>Melanoid</b>: hitam pekat tanpa bintik emas berkilau.</li><li><b>Axanthic</b>: tanpa pigmen kuning, jadi abu-abu.</li><li><b>Copper</b>: cokelat tembaga dengan mata kemerahan. Di dunia nyata cara pewarisannya belum sepenuhnya jelas; di game ini dibuat resesif.</li></ul>
<h3>2. Dominan: GFP &amp; RFP</h3><p>Gen hasil rekayasa (protein berpendar hijau/merah) yang membuat axolotl menyala di bawah lampu UV atau biru. Satu salinan sudah terlihat, dan bisa digabung dengan morph apa pun.</p>
<h3>3. Kombinasi bernama</h3><ul><li><b>Golden Albino</b> = Albino saja</li><li><b>White Albino</b> = Albino + Leucistic</li><li><b>Axanthic Albino</b> = Albino + Axanthic (hampir putih)</li><li><b>Melanoid Albino</b> = Albino + Melanoid (krem, tanpa kilau)</li><li><b>Leucistic Melanoid</b>, <b>Leucistic Axanthic</b>, <b>Axanthic Melanoid</b></li><li><b>GFP Leucistic</b>, <b>GFP Golden Albino</b>, dan kombinasi GFP/RFP lainnya</li></ul><p>Axolotl tanpa gen warna disebut <b>Wild Type</b>.</p>
<h3>4. Siklus breeding</h3><ul><li>Axolotl hanya bisa dikawinkan dengan axolotl. Jantan siap di umur 12 bulan, betina di umur 18 bulan.</li><li>Peluang bertelur ±60%; betina bertelur <b>sebulan kemudian</b>, sampai <b>100 butir</b> (betina ±70 g ±50 butir, ±110 g mendekati 100). ±15% telur tidak subur.</li><li>Telur menetas <b>sebulan</b> kemudian. Betina turun ±10% berat dan istirahat 4 bulan sebelum bisa dikawinkan lagi.</li></ul>
<h3>5. Memilih bayi</h3><p>Bayi axolotl menetas sebagai <b>satu kelompok</b> di tab Inkubator, dikelompokkan per morph dan jenis kelamin. Pilih <b>sampai 3 ekor</b> untuk masuk koleksi; sisanya otomatis dijual cepat (60% nilainya). Menjual banyak sekaligus sedikit menurunkan harga pasar morph tersebut. Kalau belum dipilih saat “Lanjut bulan”, 3 bayi paling bernilai disimpan otomatis.</p>
<h3>6. Suhu &amp; ekonomi</h3><p>Jenis kelamin axolotl ditentukan kromosom, bukan suhu, jadi selalu sekitar 50:50 dan suhu inkubatornya tidak bisa diatur. Axolotl murah per ekor, tapi satu clutch bisa menghasilkan banyak uang dari penjualan otomatis. Batas umurnya 15 tahun.</p>`,d_species:'Spesies',mk_pairnow:'bisa langsung dikawinkan',r_fage_leo:'Umur belum cukup (min. 10 bulan)',r_mage_leo:'Umur belum cukup (min. 9 bulan)',e_species_mismatch:'Hanya hewan dari spesies yang sama yang bisa dikawinkan.',br_sub_ball:'Pilih pasangan ball python, lihat peluang tiap morph keturunannya, lalu pasangkan kapan saja selama keduanya sudah cukup umur (jantan ≥10 bulan, betina ≥24 bulan). Peluang ovulasi ±55% per bulan, 2–9 telur per clutch tergantung berat betina.',br_sub_leo:'Pilih pasangan leopard gecko (jantan ≥9 bulan, betina ≥10 bulan). Peluang ovulasi ±70%. Sekali kawin, betina bertelur 4–6 clutch berturut-turut (1 clutch berisi 1–2 telur tiap bulan), lalu istirahat 3 bulan.',d_life:'Batas umur',d_life_v:p=>`${p.max} · sisa ${p.left}`,

 guide_ball:`<h3>1. Resesif: Albino, Piebald, Clown, Axanthic</h3><p>Butuh <b>dua salinan</b> gen agar terlihat (visual). Ular dengan satu salinan disebut <b>het</b>: tampak normal, tapi membawa gen tersebut.</p>
<ul><li>Visual × Normal → 100% bayi het (tampak normal)</li><li>Het × Het → 25% visual, dan bayi yang tampak normal = <b>66% pos het</b></li><li>Visual × Het → 50% visual, sisanya 100% het</li></ul>
<p>"Pos het" artinya <i>mungkin</i> het. Satu-satunya cara membuktikan adalah mengawinkannya dan melihat apakah ada bayi visual. Game akan menandai induk sebagai <b>terbukti het</b> kalau itu terjadi.</p>
<h3>2. Co-dominan: Pastel, Enchi, Yellow Belly, Cinnamon, Banana, Mojave, Lesser</h3><p>Satu salinan sudah terlihat. Dua salinan menghasilkan <b>bentuk super</b> yang berbeda: Super Pastel, Super Enchi, Ivory (super Yellow Belly), Super Cinnamon, Super Banana.</p><ul><li>Pastel × Normal → 50% Pastel, 50% Normal</li><li>Pastel × Pastel → 25% Super Pastel, 50% Pastel, 25% Normal</li></ul>
<h3>3. BEL complex (Mojave &amp; Lesser)</h3><p>Mojave dan Lesser adalah <b>alel di lokus yang sama</b>. Kombinasi dua alel apa pun (Super Mojave, Super Lesser, Mojave Lesser) menghasilkan <b>Blue-Eyed Leucistic</b>: putih bersih bermata biru. Karena satu lokus, ular BEL selalu menurunkan tepat satu alel Mojave/Lesser ke tiap bayinya.</p>
<h3>4. Dominan: Spider, Pinstripe</h3><p>Satu salinan sudah terlihat penuh, dan dua salinan tampak sama.</p>
<h3>5. Kombinasi terkenal</h3><p>Pastel + Spider = <b>Bumblebee</b> · Super Pastel + Spider = <b>Killer Bee</b> · Pastel + Pinstripe = <b>Lemon Blast</b> · Spider + Pinstripe = <b>Spinner</b> · Pastel + Spider + Pinstripe = <b>Spinnerblast</b> · Albino + Axanthic = <b>Snow</b>.</p>
<h3>6. Siklus breeding</h3><ul><li>Tidak ada musim kawin: ular bisa dikawinkan kapan saja asal umurnya cukup.</li><li>Jantan bisa dipasangkan dengan maksimal 4 betina per bulan, tapi beratnya turun ±1,5% untuk tiap pasangan.</li><li>Betina siap kawin lagi 8 bulan setelah bertelur.</li><li>Setelah ovulasi, betina bertelur ±2 bulan kemudian, dan telur menetas ±2 bulan setelah itu.</li><li><b>Jumlah telur bergantung berat betina saat bertelur:</b> ±1.300 g → 2 telur, ±1.750 g → ±5 telur, ±2.000 g → ±6 telur, ±2.300 g → ±8 telur. ±12% telur adalah slug (tidak subur).</li><li>Betina turun ±28% berat setelah bertelur dan 1% per bulan selama bunting.</li></ul>
<h3>7. Suhu inkubasi</h3><p>29 °C = ♀80% / ♂20% · 31 °C = 50/50 · 33 °C = ♀20% / ♂80%. Suhu hanya bisa diubah di tab Inkubator selama sepertiga pertama masa inkubasi.</p>
<h3>8. Kesehatan &amp; ekonomi</h3><p>Catatan dunia nyata: Spider membawa masalah neurologis ("wobble"), dan banyak breeder memilih tidak memproduksinya lagi. Di game ini gen tersebut tetap ada untuk keperluan edukasi.</p><p>Harga tiap gen naik turun. Kalau kamu terus menjual morph yang sama, pasar jadi jenuh dan harganya turun. Betina lebih mahal, dan ular yang lebih berat lebih mahal (bonus berat maksimal tercapai di ±1.840 g). Jual cepat memberi 60% nilai langsung, sedangkan iklan memberi 100% nilai tapi butuh waktu.</p>`,
guide_leo:`<h3>1. Resesif: Tremper Albino, Bell Albino, Rainwater Albino, Eclipse, Blizzard, Murphy Patternless, Marble Eye</h3><p>Sama seperti ball python: butuh <b>dua salinan</b> agar terlihat, dan gecko dengan satu salinan disebut het.</p>
<ul><li><b>Eclipse</b>: mata hitam pekat (pada albino jadi merah rubi).</li><li><b>Blizzard</b>: polos tanpa pola, putih sampai abu-abu.</li><li><b>Murphy Patternless</b>: polos tanpa bintik.</li><li><b>Marble Eye</b>: pola seperti marmer di mata.</li></ul>
<p><b>Tiga strain albino tidak saling cocok.</b> Tremper, Bell, dan Rainwater ada di lokus berbeda, jadi Tremper Albino × Bell Albino menghasilkan anak yang <b>tampak normal</b> tapi het untuk kedua strain. Selalu pasangkan albino dengan strain yang sama.</p>
<h3>2. Co-dominan: Mack Snow, Giant, Lemon Frost</h3><ul><li>Mack Snow × Mack Snow → 25% <b>Super Snow</b> (putih-hitam, mata hitam pekat)</li><li>Giant × Giant → 25% <b>Super Giant</b>. Gen ini membuat tubuh lebih besar: Giant ±1,25× dan Super Giant ±1,6× berat gecko biasa.</li><li>Lemon Frost × Lemon Frost → 25% <b>Super Lemon Frost</b> (kuning pucat berkilau)</li></ul>
<h3>3. Dominan: Enigma, White &amp; Yellow</h3><p>Satu salinan sudah terlihat penuh. Enigma memberi bercak acak tidak beraturan; White &amp; Yellow membuat sisi tubuh lebih putih dan bintik berkurang.</p>
<h3>4. Kombinasi bernama</h3><ul><li><b>RAPTOR</b> = Tremper Albino + Eclipse</li><li><b>RADAR</b> = Bell Albino + Eclipse</li><li><b>Typhoon</b> = Rainwater Albino + Eclipse</li><li><b>Diablo Blanco</b> = RAPTOR + Blizzard</li><li><b>Ember</b> = RAPTOR + Murphy Patternless</li><li><b>Nova</b> = RAPTOR + Enigma</li><li><b>Dreamsicle</b> = RAPTOR + Mack Snow + Enigma</li><li><b>Super RAPTOR</b> = RAPTOR + Super Snow</li><li><b>Calcite</b> = RADAR + White &amp; Yellow + Mack Snow + Enigma</li><li><b>Cyclone</b> = Typhoon + Murphy Patternless</li><li><b>Blazing Blizzard</b> = Blizzard + albino (strain apa saja)</li><li><b>Banana Blizzard</b> = Blizzard + Murphy Patternless</li><li><b>Banana Blazing Blizzard</b> = Blizzard + Murphy Patternless + albino</li><li><b>Total Eclipse</b> = Super Snow + Eclipse</li><li>Sifat line-bred: <b>SHTCT</b> = Super Hypo + Tangerine · <b>Sunglow</b> = SHTCT + albino (Tremper; Bell Sunglow, Rainwater Sunglow) · <b>Red Stripe</b> = Stripe + Tangerine · <b>Bold Stripe</b> = Stripe + Bold</li></ul>
<h3>5. Siklus breeding</h3><ul><li>Gecko hanya bisa dikawinkan dengan gecko. Tidak ada musim kawin.</li><li>Peluang ovulasi ±70% per bulan, lalu bertelur <b>sebulan kemudian</b>, dan telur menetas ±2 bulan setelah itu.</li><li><b>Sekali kawin, banyak clutch.</b> Seperti di dunia nyata, betina menyimpan sperma jantan, jadi satu kali kawin menghasilkan <b>4–6 clutch berturut-turut</b>, satu clutch tiap bulan, semuanya dari jantan yang sama.</li><li><b>Selalu 1–2 telur per clutch</b> (±90% berisi 2 telur). Telur tidak subur ±10% di clutch pertama dan naik ±4% di tiap clutch berikutnya.</li><li>Betina turun ±6% berat setiap bertelur dan tidak tumbuh selama musim bertelur. Kalau beratnya turun di bawah 40 g, ia <b>berhenti bertelur lebih awal</b>.</li><li>Setelah clutch terakhir, betina <b>istirahat 3 bulan</b> sebelum bisa dikawinkan lagi. Jantan bisa dipasangkan dengan maksimal 4 betina per bulan.</li></ul>
<h3>6. Suhu inkubasi</h3><p>Pada leopard gecko, suhu inkubasi benar-benar menentukan jenis kelamin (TSD), dengan pola betina–jantan–betina:</p>
<ul><li>26–27 °C → ♀80% / ♂20%</li><li>30 °C → 50/50 (bawaan)</li><li>33 °C → ♀20% / ♂80%</li><li>34 °C → kembali ♀80% / ♂20%</li></ul><p>Di dunia nyata 26 °C bisa menghasilkan hampir 100% betina; di game ini dibatasi 80%/20% supaya sama dengan ball python. Suhu hanya bisa diubah selama sepertiga pertama masa inkubasi.</p>
<h3>7. Kesehatan &amp; ekonomi</h3><p>Catatan dunia nyata: Enigma terkait <i>Enigma Syndrome</i> (gangguan saraf), Lemon Frost terkait tumor kulit, dan sebagian White &amp; Yellow juga dilaporkan punya masalah saraf. Di game ini gen-gen itu tetap ada untuk keperluan edukasi.</p><p>Gecko lebih murah dibeli dan dijual daripada ball python, tapi pakannya juga jauh lebih murah (±$1 per bulan). Bonus harga dari berat penuh di ±68 g, sehingga Giant dan Super Giant lebih cepat mencapai nilai maksimal.</p>`
},

guide_axo:`<h3>1. Recessive: Leucistic, Albino, Melanoid, Axanthic, Copper</h3><p>Almost every axolotl morph is recessive: it needs <b>two copies</b> to show, and an axolotl with one copy is het (looks Wild Type).</p>
<ul><li><b>Leucistic</b>: pinkish-white body with dark eyes and red gills, because pigment cells never reach the skin in the embryo.</li><li><b>Albino</b>: no dark pigment, light eyes. A plain albino is gold (Golden Albino).</li><li><b>Melanoid</b>: solid black without shiny gold flecks.</li><li><b>Axanthic</b>: no yellow pigment, so it looks grey.</li><li><b>Copper</b>: copper-brown with reddish eyes. Its real-world inheritance isn’t fully understood; this game treats it as recessive.</li></ul>
<h3>2. Dominant: GFP &amp; RFP</h3><p>Engineered genes (green/red fluorescent proteins) that make axolotls glow under UV or blue light. One copy shows, and they combine with any morph.</p>
<h3>3. Named combos</h3><ul><li><b>Golden Albino</b> = Albino alone</li><li><b>White Albino</b> = Albino + Leucistic</li><li><b>Axanthic Albino</b> = Albino + Axanthic (almost white)</li><li><b>Melanoid Albino</b> = Albino + Melanoid (cream, no shine)</li><li><b>Leucistic Melanoid</b>, <b>Leucistic Axanthic</b>, <b>Axanthic Melanoid</b></li><li><b>GFP Leucistic</b>, <b>GFP Golden Albino</b>, and other GFP/RFP combos</li></ul><p>An axolotl with no colour genes is called <b>Wild Type</b>.</p>
<h3>4. Breeding cycle</h3><ul><li>Axolotls can only be paired with axolotls. Males are ready at 12 months, females at 18 months.</li><li>A paired female has a ~60% chance to spawn; she lays <b>a month later</b>, up to <b>100 eggs</b> (~50 at ~70 g, close to 100 at ~110 g). About 15% of eggs are infertile.</li><li>Eggs hatch <b>a month</b> later. The female loses ~10% of her weight and rests 4 months before she can be paired again.</li></ul>
<h3>5. Picking babies</h3><p>Axolotl babies hatch as <b>one group</b> in the Incubator tab, grouped by morph and sex. Keep <b>up to 3</b> for your collection; the rest are quick-sold automatically (60% of their value). Selling many at once slightly lowers that morph’s market price. If you haven’t picked by “Next month”, the 3 most valuable babies are kept automatically.</p>
<h3>6. Temperature &amp; economy</h3><p>Axolotl sex is set by chromosomes, not temperature, so it’s always about 50:50 and the incubator temperature can’t be changed. Axolotls are cheap per animal, but one clutch can earn a lot from the automatic sale. They live up to 15 years.</p>`,d_species:'Species',mk_pairnow:'can be paired right away',r_fage_leo:'Too young (min. 10 months)',r_mage_leo:'Too young (min. 9 months)',e_species_mismatch:'Only animals of the same species can be paired.',br_sub_ball:'Pick a ball python pair, check the odds for every possible offspring, then pair them any time once both are old enough (males ≥10 months, females ≥24 months). Each month a paired female has a ~55% chance to ovulate, and lays 2–9 eggs depending on her weight.',br_sub_leo:'Pick a leopard gecko pair (males ≥9 months, females ≥10 months). A paired female has a ~70% chance to ovulate. One pairing gives 4–6 clutches in a row (1 clutch of 1–2 eggs every month), then she rests for 3 months.',d_life:'Lifespan',d_life_v:p=>`${p.max} · ${p.left} left`,

 guide_ball:`<h3>1. Recessive: Albino, Piebald, Clown, Axanthic</h3><p>A snake needs <b>two copies</b> of the gene to show it (visual). A snake with one copy is <b>het</b>: it looks normal but carries the gene.</p>
<ul><li>Visual × Normal → 100% het babies (normal-looking)</li><li>Het × Het → 25% visual, and the normal-looking babies are <b>66% pos het</b></li><li>Visual × Het → 50% visual, the rest 100% het</li></ul>
<p>"Pos het" means <i>possibly</i> het. The only way to prove it is to breed the snake and see whether visual babies appear. The game marks the parent as <b>proven het</b> when that happens.</p>
<h3>2. Co-dominant: Pastel, Enchi, Yellow Belly, Cinnamon, Banana, Mojave, Lesser</h3><p>One copy is already visible. Two copies produce a distinct <b>super form</b>: Super Pastel, Super Enchi, Ivory (super Yellow Belly), Super Cinnamon, Super Banana.</p><ul><li>Pastel × Normal → 50% Pastel, 50% Normal</li><li>Pastel × Pastel → 25% Super Pastel, 50% Pastel, 25% Normal</li></ul>
<h3>3. BEL complex (Mojave &amp; Lesser)</h3><p>Mojave and Lesser are <b>alleles at the same locus</b>. Any combination of two of them (Super Mojave, Super Lesser, Mojave Lesser) produces a <b>Blue-Eyed Leucistic</b>: solid white with blue eyes. Because it is one locus, a BEL always passes exactly one Mojave/Lesser allele to each baby.</p>
<h3>4. Dominant: Spider, Pinstripe</h3><p>One copy shows fully, and two copies look the same.</p>
<h3>5. Famous combos</h3><p>Pastel + Spider = <b>Bumblebee</b> · Super Pastel + Spider = <b>Killer Bee</b> · Pastel + Pinstripe = <b>Lemon Blast</b> · Spider + Pinstripe = <b>Spinner</b> · Pastel + Spider + Pinstripe = <b>Spinnerblast</b> · Albino + Axanthic = <b>Snow</b>.</p>
<h3>6. Breeding cycle</h3><ul><li>There is no breeding season: snakes can be paired any time once they’re old enough.</li><li>A male can be paired with up to 4 females per month, but loses ~1.5% of his weight for each pairing.</li><li>Females can be paired again 8 months after laying.</li><li>After ovulating, a female lays about 2 months later, and the eggs hatch about 2 months after that.</li><li><b>Clutch size depends on the female’s weight when she lays:</b> ~1,300 g → 2 eggs, ~1,750 g → ~5 eggs, ~2,000 g → ~6 eggs, ~2,300 g → ~8 eggs. About 12% of eggs are slugs (infertile).</li><li>Females lose about 28% of their weight after laying, and 1% per month while gravid.</li></ul>
<h3>7. Incubation temperature</h3><p>29 °C = ♀80% / ♂20% · 31 °C = 50/50 · 33 °C = ♀20% / ♂80%. You can change it in the Incubator tab only during the first third of incubation.</p>
<h3>8. Health &amp; economy</h3><p>Real-world note: Spider is linked to a neurological problem ("wobble"), and many breeders have stopped producing it. It stays in this game for educational purposes.</p><p>Prices for each gene rise and fall. If you keep selling the same morph, the market gets saturated and its price drops. Females are worth more, and heavier snakes are worth more (the weight bonus maxes out at ~1,840 g). Quick selling pays 60% of the value right away; a listing pays 100% but takes time.</p>`,
guide_leo:`<h3>1. Recessive: Tremper Albino, Bell Albino, Rainwater Albino, Eclipse, Blizzard, Murphy Patternless, Marble Eye</h3><p>Just like ball pythons: two copies are needed to show the gene, and a gecko with one copy is het.</p>
<ul><li><b>Eclipse</b>: solid black eyes (ruby red on albinos).</li><li><b>Blizzard</b>: patternless, white to grey.</li><li><b>Murphy Patternless</b>: no spots.</li><li><b>Marble Eye</b>: a marbled pattern in the eye.</li></ul>
<p><b>The three albino strains are not compatible.</b> Tremper, Bell and Rainwater sit on different loci, so Tremper Albino × Bell Albino gives <b>normal-looking</b> babies that are het for both strains. Always pair albinos of the same strain.</p>
<h3>2. Co-dominant: Mack Snow, Giant, Lemon Frost</h3><ul><li>Mack Snow × Mack Snow → 25% <b>Super Snow</b> (black and white, solid black eyes)</li><li>Giant × Giant → 25% <b>Super Giant</b>. This gene makes the body bigger: Giant ~1.25× and Super Giant ~1.6× the weight of a regular gecko.</li><li>Lemon Frost × Lemon Frost → 25% <b>Super Lemon Frost</b> (pale, frosted yellow)</li></ul>
<h3>3. Dominant: Enigma, White &amp; Yellow</h3><p>One copy shows fully. Enigma gives random, irregular blotches; White &amp; Yellow makes the sides whiter with fewer spots.</p>
<h3>4. Named combos</h3><ul><li><b>RAPTOR</b> = Tremper Albino + Eclipse</li><li><b>RADAR</b> = Bell Albino + Eclipse</li><li><b>Typhoon</b> = Rainwater Albino + Eclipse</li><li><b>Diablo Blanco</b> = RAPTOR + Blizzard</li><li><b>Ember</b> = RAPTOR + Murphy Patternless</li><li><b>Nova</b> = RAPTOR + Enigma</li><li><b>Dreamsicle</b> = RAPTOR + Mack Snow + Enigma</li><li><b>Super RAPTOR</b> = RAPTOR + Super Snow</li><li><b>Calcite</b> = RADAR + White &amp; Yellow + Mack Snow + Enigma</li><li><b>Cyclone</b> = Typhoon + Murphy Patternless</li><li><b>Blazing Blizzard</b> = Blizzard + albino (any strain)</li><li><b>Banana Blizzard</b> = Blizzard + Murphy Patternless</li><li><b>Banana Blazing Blizzard</b> = Blizzard + Murphy Patternless + albino</li><li><b>Total Eclipse</b> = Super Snow + Eclipse</li><li>Line-bred traits: <b>SHTCT</b> = Super Hypo + Tangerine · <b>Sunglow</b> = SHTCT + albino (Tremper; Bell Sunglow, Rainwater Sunglow) · <b>Red Stripe</b> = Stripe + Tangerine · <b>Bold Stripe</b> = Stripe + Bold</li></ul>
<h3>5. Breeding cycle</h3><ul><li>Geckos can only be paired with geckos. There is no breeding season.</li><li>A paired female has a ~70% chance to ovulate each month, lays <b>one month later</b>, and the eggs hatch about 2 months after that.</li><li><b>One pairing, many clutches.</b> Just like in real life, the female stores the male’s sperm, so one pairing gives <b>4–6 clutches in a row</b>, one clutch every month, all from the same male.</li><li><b>Always 1–2 eggs per clutch</b> (~90% have 2). About 10% of eggs are infertile in the first clutch, rising ~4% with each later clutch.</li><li>Females lose ~6% of their weight with every clutch and don’t grow during the laying season. If she drops below 40 g, she <b>stops laying early</b>.</li><li>After the last clutch, she <b>rests for 3 months</b> before she can be paired again. A male can be paired with up to 4 females per month.</li></ul>
<h3>6. Incubation temperature</h3><p>In leopard geckos, incubation temperature truly sets the sex (TSD), with a female–male–female pattern:</p>
<ul><li>26–27 °C → ♀80% / ♂20%</li><li>30 °C → 50/50 (default)</li><li>33 °C → ♀20% / ♂80%</li><li>34 °C → back to ♀80% / ♂20%</li></ul><p>In real life 26 °C can give almost 100% females; this game caps it at 80%/20% to match ball pythons. You can only change the temperature during the first third of incubation.</p>
<h3>7. Health &amp; economy</h3><p>Real-world note: Enigma is linked to <i>Enigma Syndrome</i> (a neurological disorder), Lemon Frost to skin tumors, and some White &amp; Yellow geckos have also been reported with neurological problems. The genes stay in this game for educational purposes.</p><p>Geckos are cheaper to buy and sell than ball pythons, but they also cost far less to feed (~$1 per month). The weight bonus maxes out at ~68 g, so Giants and Super Giants reach full value sooner.</p>`

/* ========= PLANNER BREEDING =========
   Pemain mencentang gen target (1 generasi). Planner menunjukkan hewan pembawa tiap gen dan 5 pasangan terbaik

function planLocusP(m,f,t){const l=SPECIES[BRSP].loci.find(x=>x.k===TLOC[t]);if(!l)return 0;

/* ========= MODE ONLINE: semua aksi dihitung server ========= */
var Online={busy:false,server:null,
 async act(action){
  if(this.busy)throw new Error('busy');
  this.busy=true;Cloud.status='sync';renderAcct();
  try{
   const{data,error}=await Cloud.sb.functions.invoke('game',{body:{action}});
   if(error||!data)throw new Error('network');
   if(data.error){if(data.error==='not_authenticated')Cloud.expired();throw new Error(data.error)}
   if(data.server)Online.server=data.server;
   Cloud.adopt({data:data.state,rev:data.rev});
   return data;
  }catch(e){Cloud.status=e.message==='network'?'error':'saved';Cloud.err=e.message;renderAcct();throw e}
  finally{this.busy=false}
 }
};

/* ========= AKUN & CLOUD (Supabase) ========= */
var Cloud={sb:null,user:null,profile:null,status:'checking',err:'',lastSaved:0,rpcBusy:false,
 init(){
  const C=window.MORPHLAB_CONFIG||{};
  if(!C.supabaseUrl||!C.supabasePublishableKey){this.status='off';render();return}
  if(!window.supabase||!window.supabase.createClient){this.status='nolib';render();return}
  try{this.sb=window.supabase.createClient(C.supabaseUrl,C.supabasePublishableKey)}catch(e){this.status='nolib';render();return}
  // Jangan panggil Supabase langsung di dalam callback ini (bisa deadlock) — tunda dengan setTimeout.
  this.sb.auth.onAuthStateChange((ev,session)=>{
   if(ev==='PASSWORD_RECOVERY')setTimeout(showSetPassword,0);
   const u=session&&session.user;
   if(!u&&this.status==='checking'){this.status='guest';setTimeout(render,0)}
   if(u&&(!this.user||this.user.id!==u.id)){this.user=u;setTimeout(()=>this.onLogin(),0)}
   else if(!u&&this.user)setTimeout(()=>this.toGate(),0);
  });
 },
 // Masuk ke mode online: muat (atau buat) game di server.
 async onLogin(){
  this.status='sync';this.err='';render();
  try{
   await this.ensureProfile();
   await Online.act({type:'init'});
   SEL={m:null,f:null};render();toast(t('t_online'));
   try{Social.start()}catch(e){console.warn('social',e)}
  }catch(e){this.fail(e)}
 },
 // Keluar: kembali ke halaman masuk.
 toGate(){
  Social.stop();this.user=null;this.profile=null;this.status=this.sb?'guest':'off';
  setS(null);SEL={m:null,f:null};TAB='koleksi';closeModal(true);render()},
 expired(){toast(t('e_not_authenticated'))},
 async ensureProfile(){
  const{data,error}=await this.sb.from('profiles').select('username').eq('id',this.user.id).maybeSingle();
  if(error)throw error;
  if(data){this.profile=data;return}
  const want=(this.user.user_metadata||{}).username;
  if(want){const r=await this.sb.from('profiles').insert({id:this.user.id,username:want}).select('username').single();if(!r.error){this.profile=r.data;return}}
  setTimeout(()=>showUsername(want?t('un_taken_meta',{u:esc(want)}):''),0);
 },
 async setUsername(name){
  const r=await this.sb.from('profiles').insert({id:this.user.id,username:name}).select('username').single();
  if(r.error){if(r.error.code==='23505')return t('e_taken');if(r.error.code==='23514')return t('e_unamechk');return r.error.message}
  this.profile=r.data;renderAcct();if(TAB==='teman')render();return ''},
 // Ambil ulang save dari server (mis. setelah berubah dari perangkat lain).
 async reload(){
  const{data,error}=await this.sb.from('saves').select('data,rev').eq('user_id',this.user.id).maybeSingle();
  if(error)throw error;
  if(data&&Core.isState(data.data))this.adopt(data);
 },
 // Fungsi server yang mengubah save sendiri (trade, klaim kiriman) memakai versi save terakhir dari server.
 async rpcSave(fn,args){
  if(this.rpcBusy||Online.busy)throw new Error('busy');this.rpcBusy=true;
  try{for(let i=0;i<2;i++){
    const{data,error}=await this.sb.rpc(fn,{...args,p_expected_rev:S.rev});
    if(error){if(/stale_save/.test(error.message)&&i===0){await this.reload();continue}throw new Error(error.message)}
    if(data&&data.data)this.adopt(data);
    return data}}
  finally{this.rpcBusy=false}},
 adopt(r){
  setS(r.data);S.rev=r.rev;S.snakes.forEach(s=>{s.hp=s.hp||{};dexAdd(traitsOf(s.g),spOf(s))});
  this.status='saved';this.err='';this.lastSaved=Date.now();render()},
 fail(e){console.warn('Cloud:',e);this.status='error';this.err=(e&&e.message)||String(e);renderAcct()},
 async logout(){Social.stop();try{await this.sb.auth.signOut()}catch(e){}this.toGate();toast(t('t_logout'))}
};

async function handleForm(kind,f){
 const v=n=>{const i=f.querySelector(`[name="${n}"]`);return i?i.value.trim():''};const msg=h=>{f.querySelector('.msg').innerHTML=h};
 const warn=k=>msg(`<span class="warn">${t(k)}</span>`);
 const btn=f.querySelector('button[type=submit]');const sb=Cloud.sb;if(!sb)return;
 const email=v('email'),pw=f.querySelector('[name=password]')?f.querySelector('[name=password]').value:'',un=v('username');
 if((kind==='signup'||kind==='username')&&!/^[A-Za-z0-9_]{3,20}$/.test(un))return warn('e_uname');
 if((kind==='login'||kind==='signup')&&!/^\S+@\S+\.\S+$/.test(email))return warn('e_email');
 if((kind==='login'||kind==='signup'||kind==='setpw')&&pw.length<6)return warn('e_pw');
 btn.disabled=true;msg(`<span class="kbd">${t('processing')}</span>`);
 try{
  if(kind==='login'){const{error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;closeModal(true);toast(t('t_login'))}
  else if(kind==='signup'){const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{username:un},emailRedirectTo:URL_HERE()}});if(error)throw error;
   if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){btn.disabled=false;return warn('e_exists')}
   if(data.session){closeModal(true);toast(t('t_signup'))}
   else msg(`<span class="ok">${t('su_confirm',{e:esc(email)})}</span>`)}
  else if(kind==='username'){const e=await Cloud.setUsername(un);if(e)throw new Error(e);closeModal(true);toast(t('t_uname',{u:esc(un)}))}
  else if(kind==='setpw'){const{error}=await sb.auth.updateUser({password:pw});if(error)throw error;closeModal(true);toast(t('t_pw'))}
 }catch(e){msg('<span class="warn">'+AUTH_ERR(e.message||e)+'</span>')}
 btn.disabled=false}

  logout:()=>Cloud.logout(),

   if(!/^\S+@\S+\.\S+$/.test(email)){m.innerHTML=`<span class="warn">${t('fg_need')}</span>`;return}

 };
 if(!map[a])return false;map[a]();return true}

function srcTxt(s){const r=srcOf(s);if(!r)return t('og_got_unknown');const tn=r.turn!=null?' · Turn '+r.turn:'';
 if(r.t==='trade'||r.t==='pmarket')return t('og_got_'+r.t,{u:r.from?profLink(r.from):'?'})+tn;return t('og_got_'+r.t)+tn}

/* ========= STATISTIK PRIBADI (profil sendiri) =========
   Data dari S.ps (dicatat server sejak v36). Warna seri: slot 1 biru (kekayaan bersih), slot 2 oranye (uang) —
   palet referensi yang lolos uji CVD & kontras di ketiga tema. */
var StatV={range:12,pts:[]};
const ST_CH=['order','big','ad','quick','brood','pmarket'],ST_EX=['food','util','over','buy','pbuy','rack'];
const stYear=tn=>1+Math.floor((8+tn)/12);
const kfmt=v=>{const a=Math.abs(v),sg=v<0?'-':'';return a>=1e6?sg+'$'+(a/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?sg+'$'+Math.round(a/1e3)+'k':sg+'$'+Math.round(a)};
function stPoints(){const p=S.ps||{},h=(p.hist||[]).map(x=>({lbl:t('st_month',{t:x.t,y:stYear(x.t)}),y:stYear(x.t),m:x.m,w:x.w,n:x.n,e:x.e}));
 if(StatV.range===12)return h.slice(-12);if(StatV.range===60)return h.slice(-60);
 return (p.hy||[]).map(x=>({lbl:t('st_yearend',{y:x.y}),y:x.y,m:x.m,w:x.w,n:x.n})).concat(h)}
function stTicks(lo,hi){const raw=(hi-lo)/4,mag=Math.pow(10,Math.floor(Math.log10(raw||1))),st=[1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=raw)||raw;
 const a=Math.floor(lo/st)*st,o=[];for(let v=a;v<=hi+st*.001;v+=st)o.push(v);return o}
function stChart(pts){const n=pts.length;if(n<2)return `<p class="kbd">${t('st_nodata')}</p>`;
 const W=600,H=230,L=52,R=104,T=16,B=26,vals=pts.flatMap(p=>[p.m,p.w]);let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<Math.max(100,Math.abs(hi)*.02)){lo-=Math.max(50,Math.abs(hi)*.01);hi+=Math.max(50,Math.abs(hi)*.01)}
 const ticks=stTicks(lo,hi);lo=Math.min(lo,ticks[0]);hi=Math.max(hi,ticks[ticks.length-1]);
 const X=i=>L+i*(W-L-R)/(n-1),Y=v=>T+(hi-v)*(H-T-B)/(hi-lo),path=k=>pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[k]).toFixed(1)).join('');
 let xl='',last=-1,every=Math.max(1,Math.ceil(new Set(pts.map(p=>p.y)).size/6)),seen=0;
 pts.forEach((p,i)=>{if(p.y!==last){if(seen%every===0)xl+=`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${t('st_year',{y:p.y})}</text>`;seen++;last=p.y}});
 const ev=pts.map((p,i)=>p.e?`<circle cx="${X(i).toFixed(1)}" cy="${T-8}" r="3" class="stev"><title>${esc(p.lbl)} · ${esc(t('stev_'+p.e))}</title></circle>`:'').join('');
 const end=k=>Y(pts[n-1][k]),gap=Math.abs(end('w')-end('m'))<14?(end('w')<end('m')?-7:7):0;
 return `<div class="stlegend"><span><i style="background:#3987e5"></i>${t('st_nw')}</span><span><i style="background:#d95926"></i>${t('st_money')}</span>${pts.some(p=>p.e)?`<span><b class="stevk">●</b> ${t('st_ev')}</span>`:''}</div>
 <div class="stchart" data-n="${n}" data-l="${L}" data-r="${R}" data-w="${W}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('st_chart')}">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="${v===0?'st0':'stg'}"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${kfmt(v)}</text>`).join('')}
  ${xl}${ev}
  <path d="${path('w')}" class="stl" stroke="#3987e5"/><path d="${path('m')}" class="stl" stroke="#d95926"/>
  <text x="${W-R+6}" y="${(end('w')+4-gap).toFixed(1)}" class="stlab">${t('st_nw')}</text><text x="${W-R+6}" y="${(end('m')+4+gap).toFixed(1)}" class="stlab">${t('st_money')}</text>
  <line class="stx" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none"/>
  <circle class="std w" r="4" fill="#3987e5" style="display:none"/><circle class="std m" r="4" fill="#d95926" style="display:none"/>
 </svg><div class="sttip" style="display:none"></div></div>
 <details class="sttable"><summary>${t('st_table')}</summary><table class="pv"><tr><td><b>${t('st_when')}</b></td><td class="num"><b>${t('st_money')}</b></td><td class="num"><b>${t('st_nw')}</b></td><td class="num"><b>${t('st_n')}</b></td></tr>
  ${pts.slice().reverse().map(p=>`<tr><td>${esc(p.lbl)}${p.e?` · ${esc(t('stev_'+p.e))}`:''}</td><td class="num">${money(p.m)}</td><td class="num">${money(p.w)}</td><td class="num">${fmt(p.n)}</td></tr>`).join('')}</table></details>`}

var Social={data:null,open:null,msgs:[],draft:'',chatFocus:false,ch:null,timer:null,claiming:false,seen:null,
 started(){return !!this.ch},
 start(){
  if(this.ch||!Cloud.user||!Cloud.sb)return;
  const uid=Cloud.user.id,sb=Cloud.sb;
  this.ch=sb.channel('social-'+uid)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient=eq.'+uid},p=>this.onMessage(p.new))
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'sender=eq.'+uid},p=>this.onMessage(p.new))
   .on('postgres_changes',{event:'*',schema:'public',table:'friendships'},()=>this.refresh())
   .on('postgres_changes',{event:'*',schema:'public',table:'trades'},()=>this.refresh())
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'deliveries',filter:'user_id=eq.'+uid},()=>this.claim())
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'global_messages'},p=>Global.onNew(p.new))
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'global_messages'},p=>Global.onDel(p.old&&p.old.id))
   .on('postgres_changes',{event:'*',schema:'public',table:'chat_mutes',filter:'user_id=eq.'+uid},()=>Global.loadMute())
   .subscribe();
  Global.load();Global.loadMute();Bugs.init();
  this.timer=setInterval(()=>{this.refresh();Bugs.count();Mod.count();Global.loadMute();if(TAB==='global')Global.load()},45000);   // cadangan kalau realtime terputus
  this.refresh();
 },
 stop(){if(this.ch&&Cloud.sb)try{Cloud.sb.removeChannel(this.ch)}catch(e){}this.ch=null;Global.reset();Bugs.reset();Mod.reset();clearInterval(this.timer);this.data=null;this.open=null;this.msgs=[];this.seen=null},
 badge(){const d=this.data;if(!d)return 0;return d.friends.reduce((a,f)=>a+(f.unread||0),0)+d.incoming.length+d.trades.filter(x=>x.dir==='in'&&x.status==='pending').length},
 friend(id){return this.data&&this.data.friends.find(f=>f.id===id)},
 async refresh(){
  if(!Cloud.user)return;
  const{data,error}=await Cloud.sb.rpc('get_social');if(error){console.warn('get_social',error);return}
  const prev=this.seen;this.data=data;
  const ids={req:new Set(data.incoming.map(x=>x.fid)),tr:new Set(data.trades.filter(x=>x.dir==='in'&&x.status==='pending').map(x=>x.id))};
  if(prev){data.incoming.filter(x=>!prev.req.has(x.fid)).forEach(x=>toast(t('t_newreq',{u:esc(x.username)})));
   data.trades.filter(x=>x.dir==='in'&&x.status==='pending'&&!prev.tr.has(x.id)).forEach(x=>toast(t('t_newtrade',{u:esc(x.username)})))}
  this.seen=ids;
  if(this.open&&!this.friend(this.open)){this.open=null;this.msgs=[]}
  if(data.deliveries>0)this.claim();
  this.paint();
 },
 paint(){if(TAB==='teman'&&!MODAL_LOCK)render();else renderTabs()},
 async claim(){
  if(this.claiming||!Cloud.user)return;this.claiming=true;
  try{for(let i=0;i<3;i++){const r=await Cloud.rpcSave('claim_deliveries',{});if(r&&r.count>0){toast(t('t_claimed',{n:r.count}));break}if(r)break}}
  catch(e){console.warn('claim',e)}
  this.claiming=false;
 },
 async openChat(id){
  this.open=id;this.msgs=[];this.draft='';this.paint();
  const{data,error}=await Cloud.sb.rpc('get_messages',{p_friend:id,p_before:null,p_limit:80});
  if(!error&&this.open===id){this.msgs=data||[];this.markRead(id);this.chatFocus=true;this.paint()}
 },
 async markRead(id){const f=this.friend(id);if(f)f.unread=0;await Cloud.sb.rpc('mark_read',{p_friend:id});renderTabs()},
 onMessage(m){
  if(!m||!Cloud.user)return;const me=Cloud.user.id,other=m.sender===me?m.recipient:m.sender;
  if(this.open===other){if(!this.msgs.some(x=>x.id===m.id)){this.msgs.push(m);this.msgs.sort((a,b)=>a.id-b.id)}
   if(m.sender!==me&&TAB==='teman'&&document.visibilityState!=='hidden')this.markRead(other);else if(m.sender!==me){const f=this.friend(other);if(f)f.unread=(f.unread||0)+1}}
  else if(m.sender!==me){const f=this.friend(other);if(f)f.unread=(f.unread||0)+1;toast(t('t_newmsg',{u:esc(f?f.username:'?'),b:esc(m.body.slice(0,80))}))}
  this.paint();
 },
 async send(body){
  if(!this.open||!body.trim())return;
  const{data,error}=await Cloud.sb.rpc('send_message',{p_to:this.open,p_body:body});
  if(error){toast(errText(error));return false}
  this.onMessage(data);return true;
 }

// Peringatan sebelum menawarkan / menerima trade. give/get = daftar hewan, gm/rm = uang yang diberikan / diterima.
function tradeWarnings(give,gm,get,rm,mode){const w=[],gv=give.reduce((a,s)=>a+value(s),0)+gm,rv=get.reduce((a,s)=>a+value(s),0)+rm;
 if(mode==='offer'&&!get.length&&!rm)w.push(t('tw_gift',{v:money(gv)}));
 else if(gv>rv*1.5&&gv-rv>=100)w.push(t('tw_imbalance',{g:money(gv),r:money(rv),d:money(gv-rv)}));
 const ids=new Set(give.map(s=>s.id));
 for(const sp of SPECIES_LIST){const mine=S.snakes.filter(s=>spOfG(s.g)===sp);if(mine.length&&mine.every(s=>ids.has(s.id)))w.push(t('tw_last_sp',{sp:t('sp_'+sp)}))}
 const after=S.snakes.length-give.length+get.length,over=after-cap();if(over>0)w.push(t('tw_cap',{n:after,c:cap(),x:over,v:money(over*15)}));
 if(gm>0&&gm>=S.money*.5)w.push(t('tw_money',{v:money(gm),b:money(S.money)}));
 return{w,gv,rv}}

  case 'openchat':Social.openChat(uid);return true;
  case 'fr_accept':case 'fr_decline':{const{error}=await Cloud.sb.rpc('respond_friend_request',{p_id:fid,p_accept:a==='fr_accept'});if(error)toast(errText(error));await Social.refresh();return true}
  case 'fr_remove':{const u=el.dataset.u;const go=async()=>{const{error}=await Cloud.sb.rpc('remove_friend',{p_other:uid});closeModal(true);if(error){toast(errText(error));return}if(Social.open===uid){Social.open=null;Social.msgs=[]}if(!el.dataset.quiet)toast(t('t_removed',{u:esc(u)}));await Social.refresh()};
   if(el.dataset.quiet){await go();return true}
   const nTr=(Social.data?Social.data.trades:[]).filter(x=>x.other===uid&&x.status==='pending').length;
   Social._rm=go;modal(`<h2>${t('so_remove')}</h2><p class="sub">${t('so_remove_q',{u:esc(u)})}</p>
    <div class="warnbox"><p>🗑️ ${t('so_rm_chat',{u:esc(u)})}</p><p>🔁 ${t('so_rm_trades',{u:esc(u),n:nTr})}</p><p><b>${t('so_rm_final')}</b></p></div>
    <div class="actions"><button class="danger" data-act="fr_remove_yes">${t('so_remove_yes')}</button><button class="ghost" data-act="close">${t('btn_cancel')}</button></div>`);return true}
  case 'fr_remove_yes':if(Social._rm)await Social._rm();Social._rm=null;return true;
  case 'tr_new':openTradeBuilder(uid);return true;
  case 'tb_close':TB=null;closeModal(true);return true;
  case 'tr_send':{if(!TB)return true;
   const om=Math.floor(+TB.om||0),rm=Math.floor(+TB.rm||0);
   const fail=k=>{TB.err=t(k);paintTB()};
   if(om<0||rm<0||!isFinite(om)||!isFinite(rm))return fail('tb_e_reqmoney'),true;
   if(!TB.mine.size&&!om)return fail('tb_e_empty'),true;
   if(om>S.money)return fail('tb_e_money'),true;
   if(TB.mine.size>10||TB.theirs.size>10)return fail('tb_e_max'),true;
   TB.err='';tbConfirm();return true}
  case 'tb_back':if(TB)paintTB();return true;
  case 'tr_send_yes':{if(!TB)return true;
   const om=Math.floor(+TB.om||0),rm=Math.floor(+TB.rm||0);
   const x=TB;busyModal();
   try{await Cloud.rpcSave('create_trade',{p_to:x.to,p_offer_ids:[...x.mine],p_offer_money:om,p_request_ids:[...x.theirs],p_request_money:rm,p_note:x.note||null});
    TB=null;closeModal(true);toast(t('t_tr_sent',{u:esc(x.u)}));Social.refresh()}
   catch(e){TB=x;TB.err=errText(e);paintTB()}
   return true}
  case 'tr_accept':{const x=Social.data.trades.find(r=>r.id===tid);if(!x)return true;
   const give=(x.request||[]).map(p=>byId(p.id)||p),r=tradeWarnings(give,x.request_money||0,x.offer||[],x.offer_money||0,'accept');
   modal(`<h2>${t('tr_accept')}</h2><p class="sub">${t('tr_accept_q',{u:esc(x.username)})}</p>${tradeCard({...x,status:'accepted_preview'}).replace(/<span class="tag[^>]*>[^<]*<\/span>/,'')}
   <p class="sub" style="margin:8px 0 0">${t('tw_values',{g:money(r.gv),r:money(r.rv)})}</p>${warnBlock(r,t('tw_final'))}
   <div class="actions"><button class="pri" data-act="tr_accept_yes" data-tid="${tid}">${t('tr_accept_yes')}</button><button class="ghost" data-act="close">${t('btn_cancel')}</button></div>`);return true}
  case 'tr_accept_yes':busyModal();
   try{await Cloud.rpcSave('accept_trade',{p_trade:tid});closeModal(true);toast(t('t_tr_done'));Social.refresh()}
   catch(e){closeModal(true);if(!/stale_save/.test(String(e&&e.message)))modal(`<h2>${t('tr_accept')}</h2><p class="warn">${errText(e)}</p><div class="actions"><button class="ghost" data-act="close">${t('close')}</button></div>`)}
   return true;
  case 'tr_decline':case 'tr_cancel':{const{error}=await Cloud.sb.rpc(a==='tr_decline'?'decline_trade':'cancel_trade',{p_trade:tid});
   if(error)toast(errText(error));else toast(t(a==='tr_decline'?'t_tr_declined':'t_tr_cancel'));await Social.refresh();return true}
 }
 return false}
async function socialForm(kind,f){
 if(kind==='addfriend'){const i=f.querySelector('[name=username]'),m=f.querySelector('.msg'),u=i.value.trim();if(!u)return;
  const{data,error}=await Cloud.sb.rpc('send_friend_request',{p_username:u});
  if(error){m.innerHTML=`<span class="warn">${errText(error)}</span>`;return}
  const ok=data==='sent'||data==='accepted';m.innerHTML=`<span class="${ok?'ok':'warn'}">${t('so_r_'+data,{u:esc(u)})}</span>`;if(ok)i.value='';
  const keep=m.innerHTML;await Social.refresh();const m2=document.querySelector('form[data-form=addfriend] .msg');if(m2)m2.innerHTML=keep;return}
 if(kind==='chat'){const i=f.querySelector('[name=body]');const body=i.value;if(!body.trim())return;i.value='';Social.draft='';Social.chatFocus=true;
  const ok=await Social.send(body);if(ok===false){Social.draft=body;Social.paint()}}
}

function boot(){
 setLang(LANG);
 // grafik statistik: crosshair + tooltip (mouse & sentuh)
 document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.stchart');if(c)stHover(c,e);else document.querySelectorAll('.stchart').forEach(stHide)});
 document.addEventListener('pointerdown',e=>{const c=e.target.closest&&e.target.closest('.stchart');if(c)stHover(c,e)});
 document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const a=e.target.closest('[data-act]');if(a){act(a.dataset.act,+a.dataset.id,a);return}
  if(e.target.closest('td.ck,th.ck'))return;
  const o=e.target.closest('[data-open]');if(o)openSnake(+o.dataset.open)});
 document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='bugst'||el.id==='bugcat'){Bugs[el.id==='bugst'?'st':'cat']=el.value;Bugs.loaded=false;Bugs.load();return}
  if(el.name==='img'&&el.form&&el.form.dataset.form==='bug'){Bugs.addFiles([...el.files]);el.value='';return}
  if(el.dataset&&el.dataset.tb&&TB){const set=TB[el.dataset.tb],id=+el.dataset.sid;el.checked?set.add(id):set.delete(id);TB.err='';
   const sc=[...document.querySelectorAll('#modal .tblist')].map(x=>x.scrollTop);paintTB();document.querySelectorAll('#modal .tblist').forEach((x,i)=>x.scrollTop=sc[i]||0);return}
  if(el.id==='selM'){SEL.m=+el.value;render()}else if(el.id==='selF'){SEL.f=+el.value;render()}else if(el.id==='sort'){COL.sort=el.value;COL.dir=COL_SORT[el.value][1];colSave();render()}
  else if(el.id==='pmgene'||el.id==='pmgm'){PM.f[el.id.slice(2)]=el.value;PM.save();render()}
  else if(el.id==='pmadult'){PM.f.adult=el.checked;PM.save();paintPM()}
  else if(el.id==='pmsort'){PM.f.sort=el.value;PM.save();PM.load()}
  else if(el.id==='colst'||el.id==='colsrc'||el.id==='colgene'||el.id==='colgm'){COL[el.id.slice(3)]=el.value;colSave();render()}
  else if(el.dataset&&el.dataset.colsel){const id=+el.dataset.colsel;el.checked?COL.sel.add(id):COL.sel.delete(id);paintCol()}
  else if(el.dataset&&el.dataset.colall){const L=colList().filter(s=>!s.gravid);if(el.checked)L.forEach(s=>COL.sel.add(s.id));else L.forEach(s=>COL.sel.delete(s.id));paintCol()}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
 document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form;if(k==='gchat'){Global.send(f);return}if(k==='greport'){Global.report(f);return}if(k==='gmute'){Mod.mute(f);return}if(k==='mktdown'){Mod.mktDown(f);return}if(k==='bug'){Bugs.submit(f);return}if(k==='bugc'){Bugs.comment(f);return}if(k==='bugadm'){Bugs.adminSave(f);return}if(k==='addfriend'||k==='chat')guarded(()=>socialForm(k,f));else if(k.startsWith('dz_'))dangerGo(k.slice(3),f);else if(k==='profile')saveProfile(f);else handleForm(k,f)});
 document.addEventListener('input',e=>{const el=e.target;
  if(el.form&&el.form.dataset.form==='profile'&&Profile.edit){
   if(el.name==='bio'){Profile.edit.bio=el.value;const c=$('biocnt');if(c)c.textContent=el.value.length+'/'+BIO_MAX}
   else if(el.dataset.sc){const id=+el.dataset.sc,sel=Profile.edit.sel;const i=sel.indexOf(id);if(el.checked&&i<0&&sel.length<SHOW_MAX)sel.push(id);else if(!el.checked&&i>=0)sel.splice(i,1);paintProfileEdit()}}
  else if(el.name==='confirm'&&el.form&&/^dz_/.test(el.form.dataset.form||'')){const d=DZ[el.form.dataset.form.slice(3)];el.form.querySelector('button[type=submit]').disabled=el.value.trim()!==d.w;el.form.querySelector('.msg').innerHTML=''}
  else if(el.id==='colq'){COL.q=el.value;paintCol()}
  else if(el.id==='pmq'){PM.q=el.value;paintPM()}
  else if(el.id==='pmmin'||el.id==='pmmax'){PM.f[el.id.slice(2)]=el.value===''?'':String(Math.max(0,Math.floor(+el.value||0)));PM.save();paintPM()}
  else if(el.id==='chatin'){Social.draft=el.value;Social.chatFocus=true}
  else if(el.id==='gchatin'){Global.draft=el.value;Global.focus=true}
  else if(el.dataset&&el.dataset.temp){const cid=+el.dataset.temp,temp=+el.value;game({type:'incubate',cid,temp}).then(r=>{if(r)toast(t('t_temp',{t:fmtTemp(temp),o:sexOdds(temp)}))})}
  else if(el.dataset&&el.dataset.tbf&&TB){TB[el.dataset.tbf]=el.dataset.tbf==='note'?el.value:Math.max(0,Math.floor(+el.value||0));
   const sm=$('tbsum');if(el.dataset.tbf!=='note'&&sm){const gv=S.snakes.filter(s=>TB.mine.has(s.id)).reduce((a,s)=>a+value(s),0)+TB.om,rv=TB.coll.filter(s=>TB.theirs.has(s.id)).reduce((a,s)=>a+value(s),0)+TB.rm;sm.innerHTML=t('tb_sum',{g:money(gv),r:money(rv)})+(!TB.theirs.size&&!TB.rm?' · '+t('tb_gift'):'')}}});
 document.addEventListener('focusout',e=>{if(e.target.id==='chatin')Social.chatFocus=false});
 Cloud.init();
 render();
}
if(typeof window!=='undefined'&&window.document&&!window.__TEST__)boot();
</script>
