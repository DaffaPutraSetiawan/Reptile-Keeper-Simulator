.pick{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}.form label.pickrow{display:flex;gap:10px;color:var(--fg,inherit);font-size:13px}.pickrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}.pickrow:hover{background:#25211a}.pickrow.on{background:#2f2815}.pickrow input{width:auto;margin:0}.pickrow .ord{width:16px;font-weight:800;color:var(--acc);text-align:center}.pickrow .pk{display:flex;flex-direction:column;font-size:13px}.pickrow .meta{font-size:11.5px}

.empty{color:var(--mut);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:14px}

<script>
'use strict';
/* ========= LOGIKA INTI (core.js, sama dengan yang dipakai server) ========= */
const Core=window.MorphCore;
const {LOCI,TL,TV,TLOC,ALLT,INC_ORDER,BLABEL,R,pick,clamp,money,fmt,mi,yr,cap,emptyGeno,G,locusTraits,traitsOf,nameOf,fullName,code,hetText,transmitP,childHp,breedGeno,odds,mm,baseValue,value,newSnake,byId,femaleReady,maleReady,readyMsg,dexAdd,matches}=Core;

/* ========= UTIL ========= */
const lerp=(a,b,t)=>a.map((x,i)=>x+(b[i]-x)*t);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rngSeed(s){let a=s>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function strHash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function noise(seed){const r=rngSeed(seed);const p=Array.from({length:64},()=>r());return x=>{x=((x%64)+64)%64;const i=Math.floor(x),f=x-i,s=f*f*(3-2*f);return p[i]+(p[(i+1)%64]-p[i])*s}}
function hash3(i,j,s){const h=Math.sin(i*127.1+j*311.7+s*0.0131)*43758.5453;return h-Math.floor(h)}

/* ========= BAHASA / LANGUAGE ========= */
const I18N={
id:{
 turn_n:p=>'Turn '+p.n,
 age:p=>p.m<12?p.m+' bln':Math.floor(p.m/12)+' th'+(p.m%12?' '+p.m%12+' bln':''),

 r_mage:'Umur belum cukup (min. 10 bulan)',r_mweight:'Berat belum cukup (min. 650 g)',r_mpairs:'Sudah 4 pasangan bulan ini',r_paired:'Sudah dipasangkan bulan ini',
 // catatan
 l_welcome:p=>`Selamat datang di Morph Lab! Kamu mulai dengan 5 ekor ball python, ${p.v} dan 2 rak (20 tub). Ular yang sudah cukup umur bisa langsung dikawinkan.`,

 l_listed:p=>`${p.c} diiklankan.`,l_unlisted:p=>`Iklan ${p.c} dibatalkan.`,
 l_quick:p=>`💰 ${p.c} ${p.n} dijual cepat: ${p.v}.`,
 l_paired:p=>`${p.m} dipasangkan dengan ${p.f}. Hasil ovulasi terlihat bulan depan.`,
 l_buy:p=>`🛒 Membeli ${p.c} ${p.n}${p.h?' '+p.h:''} seharga ${p.v}.`,
 l_rack:p=>`Membeli rak baru. Kapasitas sekarang ${p.cap} tub.`,
 l_fulfill:p=>`📦 ${p.c} ${p.n} dikirim ke ${buyerName(p)}. Hadiah ${p.r}!`,
 l_cloud:'☁️ Akun tersambung. Progres di perangkat ini sekarang tersimpan juga di cloud.',
 // event
 ev_expo:'Reptile Expo bulan ini! Iklan 2× lebih cepat laku.',
 ev_flood:p=>`Pasar kebanjiran ${p.g}, harganya turun 20%.`,
 ev_trend:p=>`${p.g} lagi tren di forum, harganya naik 25%.`,

 guide:`<h2>Panduan genetika</h2><p class="sub">Game ini memakai pola pewarisan morph ball python seperti di dunia nyata (disederhanakan).</p>
<h3>1. Resesif: Albino, Piebald, Clown, Axanthic</h3><p>Butuh <b>dua salinan</b> gen agar terlihat (visual). Ular dengan satu salinan disebut <b>het</b>: tampak normal, tapi membawa gen tersebut.</p>
<ul><li>Visual × Normal → 100% bayi het (tampak normal)</li><li>Het × Het → 25% visual, dan bayi yang tampak normal = <b>66% pos het</b></li><li>Visual × Het → 50% visual, sisanya 100% het</li></ul>
<p>"Pos het" artinya <i>mungkin</i> het. Satu-satunya cara membuktikan adalah mengawinkannya dan melihat apakah ada bayi visual. Game akan menandai induk sebagai <b>terbukti het</b> kalau itu terjadi.</p>
<h3>2. Co-dominan / incomplete dominant: Pastel, Enchi, Yellow Belly, Cinnamon, Banana, Mojave, Lesser</h3><p>Satu salinan sudah terlihat. Dua salinan menghasilkan <b>bentuk super</b> yang berbeda: Super Pastel, Super Enchi, Ivory (super Yellow Belly), Super Cinnamon, Super Banana.</p><ul><li>Pastel × Normal → 50% Pastel, 50% Normal</li><li>Pastel × Pastel → 25% Super Pastel, 50% Pastel, 25% Normal</li></ul>
<h3>3. BEL complex (Mojave & Lesser)</h3><p>Mojave dan Lesser adalah <b>alel di lokus yang sama</b>. Kombinasi dua alel apa pun (Super Mojave, Super Lesser, Mojave Lesser) menghasilkan <b>Blue-Eyed Leucistic</b>: putih bersih bermata biru. Karena satu lokus, ular BEL selalu menurunkan tepat satu alel Mojave/Lesser ke tiap bayinya.</p>
<h3>4. Dominan: Spider, Pinstripe</h3><p>Satu salinan sudah terlihat penuh, dan dua salinan tampak sama. Catatan dunia nyata: Spider membawa masalah neurologis ("wobble"), dan banyak breeder memilih tidak memproduksinya lagi. Di game ini gen tersebut tetap ada untuk keperluan edukasi.</p>
<h3>5. Kombinasi terkenal</h3><p>Pastel + Spider = <b>Bumblebee</b> · Super Pastel + Spider = <b>Killer Bee</b> · Pastel + Pinstripe = <b>Lemon Blast</b> · Spider + Pinstripe = <b>Spinner</b> · Albino + Axanthic = <b>Snow</b>.</p>
<h3>6. Siklus breeding</h3><ul><li>Tidak ada musim kawin: ular bisa dikawinkan kapan saja asal umurnya cukup.</li><li>Jantan siap kawin: umur ≥10 bulan. Bisa dipasangkan dengan maksimal 4 betina per bulan.</li><li>Betina siap kawin: umur ≥24 bulan, tidak sedang bunting, dan tidak bertelur dalam 8 bulan terakhir.</li><li>Peluang ovulasi ±55% per bulan, lalu bertelur ±2 bulan kemudian dan menetas ±2 bulan setelah itu.</li><li>Jumlah telur bergantung berat betina: makin berat, makin banyak telur. ±12% telur adalah slug (tidak subur).</li><li>Betina turun ±28% berat setelah bertelur.</li></ul>
<h3>7. Ekonomi</h3><p>Harga tiap gen naik turun. Kalau kamu terus menjual morph yang sama, pasar jadi jenuh dan harganya turun. Betina lebih mahal, dan ular dewasa lebih mahal daripada hatchling. Jual cepat memberi 60% nilai langsung, sedangkan iklan memberi 100% nilai tapi butuh waktu.</p>`

 guide:`<h2>Genetics guide</h2><p class="sub">This game uses real-world ball python morph inheritance (simplified).</p>
<h3>1. Recessive: Albino, Piebald, Clown, Axanthic</h3><p>A snake needs <b>two copies</b> of the gene to show it (visual). A snake with one copy is <b>het</b>: it looks normal but carries the gene.</p>
<ul><li>Visual × Normal → 100% het babies (normal-looking)</li><li>Het × Het → 25% visual, and the normal-looking babies are <b>66% pos het</b></li><li>Visual × Het → 50% visual, the rest 100% het</li></ul>
<p>"Pos het" means <i>possibly</i> het. The only way to prove it is to breed the snake and see whether visual babies appear. The game marks the parent as <b>proven het</b> when that happens.</p>
<h3>2. Co-dominant / incomplete dominant: Pastel, Enchi, Yellow Belly, Cinnamon, Banana, Mojave, Lesser</h3><p>One copy is already visible. Two copies produce a distinct <b>super form</b>: Super Pastel, Super Enchi, Ivory (super Yellow Belly), Super Cinnamon, Super Banana.</p><ul><li>Pastel × Normal → 50% Pastel, 50% Normal</li><li>Pastel × Pastel → 25% Super Pastel, 50% Pastel, 25% Normal</li></ul>
<h3>3. BEL complex (Mojave & Lesser)</h3><p>Mojave and Lesser are <b>alleles at the same locus</b>. Any combination of two of them (Super Mojave, Super Lesser, Mojave Lesser) produces a <b>Blue-Eyed Leucistic</b>: solid white with blue eyes. Because it is one locus, a BEL always passes exactly one Mojave/Lesser allele to each baby.</p>
<h3>4. Dominant: Spider, Pinstripe</h3><p>One copy shows fully, and two copies look the same. Real-world note: Spider is linked to a neurological problem ("wobble"), and many breeders have stopped producing it. It stays in this game for educational purposes.</p>
<h3>5. Famous combos</h3><p>Pastel + Spider = <b>Bumblebee</b> · Super Pastel + Spider = <b>Killer Bee</b> · Pastel + Pinstripe = <b>Lemon Blast</b> · Spider + Pinstripe = <b>Spinner</b> · Albino + Axanthic = <b>Snow</b>.</p>
<h3>6. Breeding cycle</h3><ul><li>There is no breeding season: snakes can be paired any time once they’re old enough.</li><li>Males are ready at ≥10 months and can be paired with up to 4 females per month.</li><li>Females are ready at ≥24 months, as long as they aren’t gravid and haven’t laid in the last 8 months.</li><li>Each month a paired female has a ~55% chance to ovulate; she lays about 2 months later, and the eggs hatch about 2 months after that.</li><li>Clutch size depends on the female’s weight: heavier females lay more eggs. About 12% of eggs are slugs (infertile).</li><li>Females lose about 28% of their weight after laying.</li></ul>
<h3>7. Economy</h3><p>Prices for each gene rise and fall. If you keep selling the same morph, the market gets saturated and its price drops. Females are worth more, and adults are worth more than hatchlings. Quick selling pays 60% of the value right away; a listing pays 100% but takes time.</p>`
}};

 if(s.has('banana')){g=lerp(g,[242,196,96],.7);p=[178,146,178];st.speckle=[64,42,36]}

 if(s.has('lesser')){g=lerp(g,[206,162,98],.6);p=lerp(p,[98,72,52],.5);st.outline=[226,206,166]}
 if(s.has('yb')){st.flame=true;st.reduce+=.03}
 if(s.has('clown'))g=lerp(g,[208,146,62],.4);
 if(s.has('albino')){p=[250,246,234];g=lerp([Math.min(255,g[0]+45),Math.min(255,g[1]+40),Math.max(0,g[2]-25)],[250,204,72],.5);eye=[214,58,72];if(st.speckle)st.speckle=[232,170,160];belly=[252,248,236];st.solid=Math.min(st.solid,.2)}

 if(s.has('albino')&&s.has('axanthic')){g=[244,238,222];p=[252,250,244];belly=[255,255,252]}

function colorAt(t,u,A,st,n1,n2,n3,bands,seed){
 const au=Math.abs(u),g=A.g,p=A.p;
 const v=Math.sin((t*bands+.45*n1(t*7)+.55*au*au+(u<0?.08:0))*6.2832);
 const T=-.05-st.reduce*1.6;let pat=false,faint=0;
 if(st.clown)pat=au<.16+.06*n2(t*12)||(au>.5&&au<.8&&v>.9);
 else if(st.spider&&st.pin)pat=au<.05||(Math.abs(v)<.05&&au>.3);
 else if(st.spider)pat=au<.07||(Math.abs(v)<.09+.04*n3(t*10)&&au>.16);
 else if(st.pin){pat=au<.055;if(!pat&&au>.55&&au<.62&&v>.2){pat=true;faint=.5}}
 else if(au<.22){const v2=Math.sin((t*bands+.5+.3*n2(t*9))*6.2832);pat=!(v2>.45-st.reduce*1.4)}
 else{pat=!(v>T);if(!pat&&st.reduce<.3&&au>.55&&au<.86&&v>.8&&v<.97)pat=true}
 let c;
 if(pat)c=lerp(p,g,Math.max(st.solid,faint));
 else{c=g.slice();if(st.outline&&!st.clown&&!st.spider&&!st.pin&&Math.abs(v-T)<.14&&au>=.22)c=lerp(c,st.outline,.65);
  if(st.speckle&&hash3(Math.floor(t*150),Math.floor((u+1)*5),seed)<.07)c=lerp(c,st.speckle,.8)}
 if(au>.8)c=lerp(c,A.belly,(au-.8)/.2*(st.flame?.55:.25));
 if(st.dorsal&&au<.14)c=lerp(c,st.dorsal,.75*(1-au/.14));
 if(st.pied){const wm=n2(t*3.1+20)+.3*au-(t<.13?1:0)-(t>.9?.15:0);if(wm>.52)c=[250,249,245]}
 let f=1.06-.34*au*au;if(u>-.55&&u<-.15)f+=.07;
 return[clamp(c[0]*f,0,255),clamp(c[1]*f,0,255),clamp(c[2]*f,0,255)]}
function drawSnake(cv,tr,seed){
 const W=cv.width,H=cv.height,x=cv.getContext('2d');x.clearRect(0,0,W,H);
 const A=appearance(tr),st=A.st,n1=noise(seed+1),n2=noise(seed+2),n3=noise(seed+3),rr=rngSeed(seed+9);
 const R0=H*.12,amp=H*.22,mx=W*.12,ph=rr()*6.283,fq=1.2+rr()*.35,bands=8.5+rr()*2;
 const pos=t=>[mx+t*(W-2*mx),H*.5+amp*Math.sin(t*6.283*fq+ph)*(.5+.5*t)];
 const rad=t=>t<.22?R0*(.6+.4*t/.22):t<.66?R0:R0*Math.max(.1,1-(t-.66)/.34*.92);
 x.fillStyle='rgba(0,0,0,.22)';
 for(let i=0;i<=220;i++){const t=.02+i/220*.98,[px,py]=pos(t);x.beginPath();x.arc(px+H*.02,py+H*.035,rad(t)*1.05,0,6.283);x.fill()}
 const N=Math.round(W*1.4),L=18;
 for(let i=N;i>=0;i--){const t=.03+i/N*.97,[px,py]=pos(t),[ax,ay]=pos(t+.002),[bx,by]=pos(t-.002);
  let dx=ax-bx,dy=ay-by;const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;const nx=-dy,ny=dx,r=rad(t),sz=Math.max(1.6,2*r/L+1.2);
  for(let j=0;j<L;j++){const u=-1+(j+.5)*2/L,c=colorAt(t,u,A,st,n1,n2,n3,bands,seed);
   x.fillStyle=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;x.fillRect(px+nx*u*r-sz/2,py+ny*u*r-sz/2,sz,sz)}}
 const[hx,hy]=pos(.03),[ax,ay]=pos(.05);let dx=hx-ax,dy=hy-ay;const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
 const sh=(c,f)=>`rgb(${c.map(v=>clamp(v*f,0,255)|0).join(',')})`;
 x.save();x.translate(hx+dx*R0*.7,hy+dy*R0*.7);x.rotate(Math.atan2(dy,dx));
 const hl=R0*1.12,hw=R0*.8;
 // kepala berbentuk tetes: belakang lebar, moncong mengecil
 x.fillStyle=sh(A.g,.96);x.beginPath();x.moveTo(-hl*.9,0);
 x.bezierCurveTo(-hl*.9,-hw*1.05,hl*.55,-hw*.95,hl,0);x.bezierCurveTo(hl*.55,hw*.95,-hl*.9,hw*1.05,-hl*.9,0);x.fill();
 // head stamp gelap di atas kepala
 x.fillStyle=sh(lerp(A.p,A.g,st.solid),.95);x.beginPath();x.moveTo(-hl*.85,0);
 x.bezierCurveTo(-hl*.85,-hw*.5,hl*.35,-hw*.38,hl*.7,0);x.bezierCurveTo(hl*.35,hw*.38,-hl*.85,hw*.5,-hl*.85,0);x.fill();
 x.fillStyle=sh(A.eye,1);for(const s of[-1,1]){x.beginPath();x.arc(hl*.3,s*hw*.66,R0*.14,0,6.283);x.fill()}
 x.fillStyle='rgba(255,255,255,.55)';for(const s of[-1,1]){x.beginPath();x.arc(hl*.34,s*hw*.62,R0*.045,0,6.283);x.fill()}
 x.restore()}

// Jalankan aksi game: dikirim ke server (Edge Function "game") yang menghitung hasilnya.
async function game(a){
 if(!Cloud.user||!S)return null;
 let r;try{r=await Online.act(a)}catch(e){toast(errText(e));
  // aksi ditolak: tampilkan lagi data asli dari server (buang perubahan di layar yang tidak sah)
  if(e.message!=='busy')try{await Cloud.reload()}catch(_){}
  render();return null}
 render();
 if(a.type==='advance')toast(`<b>${dateTxt()}</b>${r.head&&r.head.length?' — '+esc(r.head.slice(0,3).map(h=>t(h[0],h[1])).join(' · ')):esc(t('h_quiet'))}`);
 else if(r.toast)toast(t(r.toast));
 return r}
const GATE_ACTS=new Set(['dz_open','dz_next','lang','login','signup','authmode','close','togglepw','forgot','acctinfo','gate_retry','gate_reload','logout','account','pickname']);
function act(a,id,el){
 if(!S&&!GATE_ACTS.has(a))return;
 if(a==='gate_reload'){location.reload();return}
 if(a==='gate_retry'){Cloud.onLogin();return}
 if((Cloud.rpcBusy||Online.busy)&&!FREE_ACTS.has(a)){toast(t('busy'));return}
 if(PROFILE_ACTS.has(a)){profileAct(a,el);return}
 if(SOCIAL_ACTS.has(a)){guarded(()=>socialAct(a,el));return}
 if(cloudAct(a,el))return;
 if(a==='tab'&&el.dataset.tab==='teman'&&Social.ch)Social.refresh();
 switch(a){
  case 'tab':TAB=el.dataset.tab;break;
  case 'lang':setLang(el.dataset.v);break;
  case 'filter':FILTER=el.dataset.v;break;
  case 'close':closeModal();return;
  case 'tobreed':{const s=byId(id);if(s.sex==='M')SEL.m=id;else SEL.f=id;TAB='breeding';closeModal();break}
  case 'reset':dangerStep1('reset');return;
  case 'clearlog':modal(`<h2>${t('log_clear_h')}</h2><p class="sub">${t('log_clear_q')}</p><div class="actions"><button class="danger" data-act="clearlogyes">${t('log_clear_yes')}</button><button class="ghost" data-act="close">${t('btn_cancel')}</button></div>`);return;
  case 'clearlogyes':closeModal();game({type:'clearlog'});return;
  // aksi game (divalidasi ulang oleh core / server)
  case 'advance':game({type:'advance'});return;
  case 'nick':{const name=$('nick').value;closeModal();game({type:'nick',id,name});return}
  case 'list':closeModal();game({type:'list',id});return;
  case 'quicksell':closeModal();game({type:'quicksell',id});return;
  case 'pair':game({type:'pair',m:SEL.m,f:SEL.f});return;
  case 'unpair':game({type:'unpair',f:id});return;
  case 'buy':game({type:'buy',lid:id});return;
  case 'rack':game({type:'rack'});return;
  case 'fulfill':{const sel=$('ord-'+id);if(sel)game({type:'fulfill',oid:id,sid:+sel.value});return}
 }
 render()}

/* ========= MODE ONLINE: semua aksi dihitung server ========= */
var Online={busy:false,
 async act(action){
  if(this.busy)throw new Error('busy');
  this.busy=true;Cloud.status='sync';renderAcct();
  try{
   const{data,error}=await Cloud.sb.functions.invoke('game',{body:{action}});
   if(error||!data)throw new Error('network');
   if(data.error){if(data.error==='not_authenticated')Cloud.expired();throw new Error(data.error)}
   Cloud.adopt({data:data.state,rev:data.rev});
   return data;
  }catch(e){Cloud.status=e.message==='network'?'error':'saved';Cloud.err=e.message;renderAcct();throw e}
  finally{this.busy=false}
 }
};

/* ========= AKUN & CLOUD (Supabase) ========= */
var Cloud={sb:null,user:null,profile:null,status:'checking',err:'',lastSaved:0,rpcBusy:false,
 init(){
  const C=window.MORPHLAB_CONFIG||{};
  if(!C.supabaseUrl||!C.supabasePublishableKey){this.status='off';render();return}
  if(!window.supabase||!window.supabase.createClient){this.status='nolib';render();return}
  try{this.sb=window.supabase.createClient(C.supabaseUrl,C.supabasePublishableKey)}catch(e){this.status='nolib';render();return}
  // Jangan panggil Supabase langsung di dalam callback ini (bisa deadlock) — tunda dengan setTimeout.
  this.sb.auth.onAuthStateChange((ev,session)=>{
   if(ev==='PASSWORD_RECOVERY')setTimeout(showSetPassword,0);
   const u=session&&session.user;
   if(!u&&this.status==='checking'){this.status='guest';setTimeout(render,0)}
   if(u&&(!this.user||this.user.id!==u.id)){this.user=u;setTimeout(()=>this.onLogin(),0)}
   else if(!u&&this.user)setTimeout(()=>this.toGate(),0);
  });
 },
 // Masuk ke mode online: muat (atau buat) game di server.
 async onLogin(){
  this.status='sync';this.err='';render();
  try{
   await this.ensureProfile();
   await Online.act({type:'init'});
   SEL={m:null,f:null};render();toast(t('t_online'));
   try{Social.start()}catch(e){console.warn('social',e)}
  }catch(e){this.fail(e)}
 },
 // Keluar: kembali ke halaman masuk.
 toGate(){
  Social.stop();this.user=null;this.profile=null;this.status=this.sb?'guest':'off';
  setS(null);SEL={m:null,f:null};TAB='koleksi';closeModal(true);render()},
 expired(){toast(t('e_not_authenticated'))},
 async ensureProfile(){
  const{data,error}=await this.sb.from('profiles').select('username').eq('id',this.user.id).maybeSingle();
  if(error)throw error;
  if(data){this.profile=data;return}
  const want=(this.user.user_metadata||{}).username;
  if(want){const r=await this.sb.from('profiles').insert({id:this.user.id,username:want}).select('username').single();if(!r.error){this.profile=r.data;return}}
  setTimeout(()=>showUsername(want?t('un_taken_meta',{u:esc(want)}):''),0);
 },
 async setUsername(name){
  const r=await this.sb.from('profiles').insert({id:this.user.id,username:name}).select('username').single();
  if(r.error){if(r.error.code==='23505')return t('e_taken');if(r.error.code==='23514')return t('e_unamechk');return r.error.message}
  this.profile=r.data;renderAcct();if(TAB==='teman')render();return ''},
 // Ambil ulang save dari server (mis. setelah berubah dari perangkat lain).
 async reload(){
  const{data,error}=await this.sb.from('saves').select('data,rev').eq('user_id',this.user.id).maybeSingle();
  if(error)throw error;
  if(data&&Core.isState(data.data))this.adopt(data);
 },
 // Fungsi server yang mengubah save sendiri (trade, klaim kiriman) memakai versi save terakhir dari server.
 async rpcSave(fn,args){
  if(this.rpcBusy||Online.busy)throw new Error('busy');this.rpcBusy=true;
  try{for(let i=0;i<2;i++){
    const{data,error}=await this.sb.rpc(fn,{...args,p_expected_rev:S.rev});
    if(error){if(/stale_save/.test(error.message)&&i===0){await this.reload();continue}throw new Error(error.message)}
    if(data&&data.data)this.adopt(data);
    return data}}
  finally{this.rpcBusy=false}},
 adopt(r){
  setS(r.data);S.rev=r.rev;S.snakes.forEach(s=>{s.hp=s.hp||{};dexAdd(traitsOf(s.g))});
  this.status='saved';this.err='';this.lastSaved=Date.now();render()},
 fail(e){console.warn('Cloud:',e);this.status='error';this.err=(e&&e.message)||String(e);renderAcct()},
 async logout(){Social.stop();try{await this.sb.auth.signOut()}catch(e){}this.toGate();toast(t('t_logout'))}
};

 ${d.outgoing.length?`<div class="lbl">${t('so_outgoing_h')}</div>${d.outgoing.map(r=>`<div class="frow"><span class="kbd">⏳ ${profLink(r.username)}</span><button class="sm ghost" data-act="fr_remove" data-uid="${r.id}" data-u="${esc(r.username)}" data-quiet="1">${t('so_cancel_req')}</button></div>`).join('')}`:''}
 </div><div class="col-right panel">`;
 if(!cur)h+=`<div class="empty" style="border:none">${t('so_chat_pick')}</div>`;
 else{
  h+=`<div class="chathead"><b>🦎 ${esc(cur.username)}</b><span class="row"><button class="sm" data-act="profile" data-u="${esc(cur.username)}">👤 ${t('pf_view')}</button><button class="pri sm" data-act="tr_new" data-uid="${cur.id}">${t('so_trade_btn')}</button><button class="sm ghost" data-act="fr_remove" data-uid="${cur.id}" data-u="${esc(cur.username)}">${t('so_remove')}</button></span></div>
  <div class="chatlog" id="chatlog">${Social.msgs.length?Social.msgs.map(m=>{const mine=m.sender===Cloud.user.id;return `<div class="bub ${mine?'me':''}"><div>${esc(m.body)}</div><span>${mine?t('so_you'):esc(cur.username)} · ${hm(m.created_at)}</span></div>`}).join(''):`<p class="kbd" style="text-align:center;margin:30px 0">${t('so_chat_empty',{u:esc(cur.username)})}</p>`}</div>
  <form data-form="chat" class="row chatin" novalidate><input id="chatin" name="body" maxlength="1000" autocomplete="off" placeholder="${t('so_chat_ph')}" value="${esc(Social.draft)}"><button class="pri" type="submit">${t('so_send')}</button></form>`}
 h+=`</div></div>`;
 const tin=d.trades.filter(x=>x.dir==='in'&&x.status==='pending'),tout=d.trades.filter(x=>x.dir==='out'&&x.status==='pending'),hist=d.trades.filter(x=>x.status!=='pending').slice(0,10);
 h+=`<h3>${t('tr_in_h')} (${tin.length})</h3>${tin.length?`<div class="tgrid">${tin.map(tradeCard).join('')}</div>`:`<p class="kbd">${t('tr_none')}</p>`}
 <h3>${t('tr_out_h')} (${tout.length})</h3>${tout.length?`<div class="tgrid">${tout.map(tradeCard).join('')}</div>`:`<p class="kbd">${t('tr_none')}</p>`}
 ${hist.length?`<h3>${t('tr_hist_h')}</h3><div class="tgrid">${hist.map(tradeCard).join('')}</div>`:''}`;
 return h}
function afterRender(){
 if(TAB!=='teman')return;
 const log=$('chatlog');if(log)log.scrollTop=log.scrollHeight;
 const ci=$('chatin');if(ci&&Social.chatFocus){ci.focus();ci.setSelectionRange(ci.value.length,ci.value.length)}
}

/* ---- penyusun tawaran trade ---- */
let TB=null;
async function openTradeBuilder(uid){
 const f=Social.friend(uid);if(!f)return;
 TB={to:uid,u:f.username,mine:new Set(),theirs:new Set(),om:0,rm:0,note:'',coll:null,err:''};
 modal(`<h2>${t('tb_h',{u:esc(f.username)})}</h2><p class="sub">${t('tb_loading')}</p>`);
 const{data,error}=await Cloud.sb.rpc('get_friend_collection',{p_friend:uid});
 if(!TB||TB.to!==uid)return;
 if(error){modal(`<h2>${t('tb_h',{u:esc(f.username)})}</h2><p class="warn">${errText(error)}</p><div class="actions"><button class="ghost" data-act="close">${t('close')}</button></div>`);return}
 TB.coll=data.snakes||[];paintTB();
}
function tbRow(s,side){const tr=traitsOf(s.g),blk=tradeBlock(s),on=TB[side].has(s.id);
 return `<label class="tbrow ${blk?'off':''} ${on?'on':''}"><input type="checkbox" data-tb="${side}" data-sid="${s.id}" ${on?'checked':''} ${blk?'disabled':''}><img class="mini" src="${thumb(tr,s.seed)}" alt=""><div><div>${sexIcon(s.sex)} ${esc(nameOf(tr,s.g))}</div><div class="het">${esc(hetText(s))}</div><div class="meta">${ageTxt(s.age)} · ${fmt(s.w)} g · ${money(value(s))}${blk?` · <span class="warn">${t(blk)}</span>`:''}</div>${originLine(s,side==='mine'?null:TB.u,true)}</div></label>`}
function paintTB(){
 if(!TB||!TB.coll)return;
 const gv=S.snakes.filter(s=>TB.mine.has(s.id)).reduce((a,s)=>a+value(s),0)+TB.om,rv=TB.coll.filter(s=>TB.theirs.has(s.id)).reduce((a,s)=>a+value(s),0)+TB.rm;
 modal(`<h2>${t('tb_h',{u:esc(TB.u)})}</h2><p class="sub">${t('tb_escrow_note')}</p>
 <div class="grid2 tb"><div><div class="lbl">${t('tb_give_h')}</div><div class="tblist">${S.snakes.length?S.snakes.map(s=>tbRow(s,'mine')).join(''):`<p class="kbd">${t('tb_none_mine')}</p>`}</div>
  <label class="tbm">💵 ${t('tb_money')} <input type="number" min="0" step="5" data-tbf="om" value="${TB.om||''}" placeholder="0"> <span class="kbd">/ ${money(S.money)}</span></label></div>
 <div><div class="lbl">${t('tb_get_h',{u:esc(TB.u)})}</div><div class="tblist">${TB.coll.length?TB.coll.map(s=>tbRow(s,'theirs')).join(''):`<p class="kbd">${t('tb_none_theirs')}</p>`}</div>
  <label class="tbm">💵 ${t('tb_money')} <input type="number" min="0" step="5" data-tbf="rm" value="${TB.rm||''}" placeholder="0"></label></div></div>
 <input data-tbf="note" maxlength="200" placeholder="${t('tb_note_ph')}" value="${esc(TB.note)}" style="margin-top:10px">
 <p class="sub" id="tbsum" style="margin:10px 0 0">${t('tb_sum',{g:money(gv),r:money(rv)})}${!TB.theirs.size&&!TB.rm?' · '+t('tb_gift'):''}</p>
 <div class="msg">${TB.err?`<span class="warn">${TB.err}</span>`:''}</div>
 <div class="actions"><button class="pri" data-act="tr_send">${t('tb_send')}</button><button class="ghost" data-act="tb_close">${t('btn_cancel')}</button></div>`,true);
}
function busyModal(){modal(`<p class="sub" style="margin:8px 0">⏳ ${t('busy')}</p>`,true)}
async function guarded(fn){if(Cloud.rpcBusy){toast(t('busy'));return}try{return await fn()}catch(e){toast(errText(e));console.warn(e)}}
async function socialAct(a,el){
 const uid=el.dataset.uid,tid=+el.dataset.tid,fid=+el.dataset.fid;
 switch(a){
  case 'openchat':Social.openChat(uid);return true;
  case 'fr_accept':case 'fr_decline':{const{error}=await Cloud.sb.rpc('respond_friend_request',{p_id:fid,p_accept:a==='fr_accept'});if(error)toast(errText(error));await Social.refresh();return true}
  case 'fr_remove':{const u=el.dataset.u;const go=async()=>{const{error}=await Cloud.sb.rpc('remove_friend',{p_other:uid});closeModal(true);if(error){toast(errText(error));return}if(Social.open===uid){Social.open=null;Social.msgs=[]}if(!el.dataset.quiet)toast(t('t_removed',{u:esc(u)}));await Social.refresh()};
   if(el.dataset.quiet){await go();return true}
   const nTr=(Social.data?Social.data.trades:[]).filter(x=>x.other===uid&&x.status==='pending').length;
   Social._rm=go;modal(`<h2>${t('so_remove')}</h2><p class="sub">${t('so_remove_q',{u:esc(u)})}</p>
    <div class="warnbox"><p>🗑️ ${t('so_rm_chat',{u:esc(u)})}</p><p>🔁 ${t('so_rm_trades',{u:esc(u),n:nTr})}</p><p><b>${t('so_rm_final')}</b></p></div>
    <div class="actions"><button class="danger" data-act="fr_remove_yes">${t('so_remove_yes')}</button><button class="ghost" data-act="close">${t('btn_cancel')}</button></div>`);return true}
  case 'fr_remove_yes':if(Social._rm)await Social._rm();Social._rm=null;return true;
  case 'tr_new':openTradeBuilder(uid);return true;
  case 'tb_close':TB=null;closeModal(true);return true;
  case 'tr_send':{if(!TB)return true;
   const om=Math.floor(+TB.om||0),rm=Math.floor(+TB.rm||0);
   const fail=k=>{TB.err=t(k);paintTB()};
   if(om<0||rm<0||!isFinite(om)||!isFinite(rm))return fail('tb_e_reqmoney'),true;
   if(!TB.mine.size&&!om)return fail('tb_e_empty'),true;
   if(om>S.money)return fail('tb_e_money'),true;
   if(TB.mine.size>10||TB.theirs.size>10)return fail('tb_e_max'),true;
   const x=TB;busyModal();
   try{await Cloud.rpcSave('create_trade',{p_to:x.to,p_offer_ids:[...x.mine],p_offer_money:om,p_request_ids:[...x.theirs],p_request_money:rm,p_note:x.note||null});
    TB=null;closeModal(true);toast(t('t_tr_sent',{u:esc(x.u)}));Social.refresh()}
   catch(e){TB=x;TB.err=errText(e);paintTB()}
   return true}
  case 'tr_accept':{const x=Social.data.trades.find(r=>r.id===tid);if(!x)return true;
   modal(`<h2>${t('tr_accept')}</h2><p class="sub">${t('tr_accept_q',{u:esc(x.username)})}</p>${tradeCard({...x,status:'accepted_preview'}).replace(/<span class="tag[^>]*>[^<]*<\/span>/,'')}<div class="actions"><button class="pri" data-act="tr_accept_yes" data-tid="${tid}">${t('tr_accept')}</button><button class="ghost" data-act="close">${t('btn_cancel')}</button></div>`);return true}
  case 'tr_accept_yes':busyModal();
   try{await Cloud.rpcSave('accept_trade',{p_trade:tid});closeModal(true);toast(t('t_tr_done'));Social.refresh()}
   catch(e){closeModal(true);if(!/stale_save/.test(String(e&&e.message)))modal(`<h2>${t('tr_accept')}</h2><p class="warn">${errText(e)}</p><div class="actions"><button class="ghost" data-act="close">${t('close')}</button></div>`)}
   return true;
  case 'tr_decline':case 'tr_cancel':{const{error}=await Cloud.sb.rpc(a==='tr_decline'?'decline_trade':'cancel_trade',{p_trade:tid});
   if(error)toast(errText(error));else toast(t(a==='tr_decline'?'t_tr_declined':'t_tr_cancel'));await Social.refresh();return true}
 }
 return false}
async function socialForm(kind,f){
 if(kind==='addfriend'){const i=f.querySelector('[name=username]'),m=f.querySelector('.msg'),u=i.value.trim();if(!u)return;
  const{data,error}=await Cloud.sb.rpc('send_friend_request',{p_username:u});
  if(error){m.innerHTML=`<span class="warn">${errText(error)}</span>`;return}
  const ok=data==='sent'||data==='accepted';m.innerHTML=`<span class="${ok?'ok':'warn'}">${t('so_r_'+data,{u:esc(u)})}</span>`;if(ok)i.value='';
  const keep=m.innerHTML;await Social.refresh();const m2=document.querySelector('form[data-form=addfriend] .msg');if(m2)m2.innerHTML=keep;return}
 if(kind==='chat'){const i=f.querySelector('[name=body]');const body=i.value;if(!body.trim())return;i.value='';Social.draft='';Social.chatFocus=true;
  const ok=await Social.send(body);if(ok===false){Social.draft=body;Social.paint()}}
}

function boot(){
 setLang(LANG);
 document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const a=e.target.closest('[data-act]');if(a){act(a.dataset.act,+a.dataset.id,a);return}
  const o=e.target.closest('[data-open]');if(o)openSnake(+o.dataset.open)});
 document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset&&el.dataset.tb&&TB){const set=TB[el.dataset.tb],id=+el.dataset.sid;el.checked?set.add(id):set.delete(id);TB.err='';
   const sc=[...document.querySelectorAll('#modal .tblist')].map(x=>x.scrollTop);paintTB();document.querySelectorAll('#modal .tblist').forEach((x,i)=>x.scrollTop=sc[i]||0);return}
  if(el.id==='selM'){SEL.m=+el.value;render()}else if(el.id==='selF'){SEL.f=+el.value;render()}else if(el.id==='sort'){SORT=el.value;render()}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
 document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form;if(k==='addfriend'||k==='chat')guarded(()=>socialForm(k,f));else if(k.startsWith('dz_'))dangerGo(k.slice(3),f);else if(k==='profile')saveProfile(f);else handleForm(k,f)});
 document.addEventListener('input',e=>{const el=e.target;
  if(el.form&&el.form.dataset.form==='profile'&&Profile.edit){
   if(el.name==='bio'){Profile.edit.bio=el.value;const c=$('biocnt');if(c)c.textContent=el.value.length+'/'+BIO_MAX}
   else if(el.dataset.sc){const id=+el.dataset.sc,sel=Profile.edit.sel;const i=sel.indexOf(id);if(el.checked&&i<0&&sel.length<SHOW_MAX)sel.push(id);else if(!el.checked&&i>=0)sel.splice(i,1);paintProfileEdit()}}
  else if(el.name==='confirm'&&el.form&&/^dz_/.test(el.form.dataset.form||'')){const d=DZ[el.form.dataset.form.slice(3)];el.form.querySelector('button[type=submit]').disabled=el.value.trim()!==d.w;el.form.querySelector('.msg').innerHTML=''}
  else if(el.id==='chatin'){Social.draft=el.value;Social.chatFocus=true}
  else if(el.dataset&&el.dataset.tbf&&TB){TB[el.dataset.tbf]=el.dataset.tbf==='note'?el.value:Math.max(0,Math.floor(+el.value||0));
   const sm=$('tbsum');if(el.dataset.tbf!=='note'&&sm){const gv=S.snakes.filter(s=>TB.mine.has(s.id)).reduce((a,s)=>a+value(s),0)+TB.om,rv=TB.coll.filter(s=>TB.theirs.has(s.id)).reduce((a,s)=>a+value(s),0)+TB.rm;sm.innerHTML=t('tb_sum',{g:money(gv),r:money(rv)})+(!TB.theirs.size&&!TB.rm?' · '+t('tb_gift'):'')}}});
 document.addEventListener('focusout',e=>{if(e.target.id==='chatin')Social.chatFocus=false});
 Cloud.init();
 render();
}
if(typeof window!=='undefined'&&window.document&&!window.__TEST__)boot();
</script>
